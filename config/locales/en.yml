en:
  activerecord:
    attributes:
      aikotoba/account:
        email: Email
        password: Password
        password_hash: Password
      aikotoba/account/password_hash:
        plaintext: Password
    models:
      aikotoba/account: Account
  aikotoba:
    sessions:
      new: Sign in
    accounts:
      new: Sign up
    confirms:
      new: Send confirm token
    unlocks:
      new: Send unlock token
    recoveries:
      new: Send password reset token
      edit: Password reset
    two_factors:
      new: Two-factor authentication
      submit: Verify
      restart: Start over and sign in again
      email_otp:
        instruction: We sent a verification code to your email address. Enter it to finish signing in.
        label: Verification code
      totp:
        instruction: Enter the 6-digit code your authenticator app shows for this account.
        label: Authentication code
    totps:
      show: Authenticator app
      enabled: Your authenticator app is set up. You are asked for its code when you sign in.
      scan: Scan this QR code with your authenticator app, then enter the 6-digit code it shows.
      secret: If you can't scan it, enter this key in the app instead
      code: Authentication code
      enable: Turn on
      disable_instruction: To turn it off, enter a current code from the app.
      disable: Turn off
    mailers:
      confirm:
        subject: "Confirmation instructions"
      unlock:
        subject: "Unlock instructions"
      recover:
        subject: "Password reset instructions"
      email_otp:
        subject: "Your verification code"

    messages:
      authentication:
        success: Signed in successfully.
        failed: Oops. Signed in failed.
        sign_out: Signed out.
      registration:
        success: Signed up successfully.
        failed: Oops. Signed up failed.
      confirmation:
        sent: Confirm url has been sent to your email address (if user with that email address exists).
        success: Confirmed you email successfully.
        failed: Oops. Confirm failed.
      unlocking:
        sent: Unlock url has been sent to your email address (if user with that email address exists).
        success: Unlocked you account successfully.
        failed: Oops. Unlock failed.
      recovery:
        sent: Password reset url has been sent to your email address (if user with that email address exists).
        success: Password reset you account successfully.
        failed: Oops. Password reset failed.
      two_factor:
        required: One more step is needed to finish signing in.
        failed: Oops. Two-factor authentication failed.
        expired: Two-factor authentication has expired or too many attempts were made. Please sign in again.
      totp:
        enabled: Your authenticator app is now set up.
        disabled: Your authenticator app has been turned off.
        failed: Oops. That code didn't match. Check the time on your device and try again.
